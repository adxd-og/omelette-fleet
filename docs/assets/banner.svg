<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Omelette Fleet</title>
  <desc id="desc">Gemini, Grok and Codex as read-only units in Claude Code</desc>

  <!-- One filled card rather than transparent text: GitHub serves this SVG as an
       image, so it cannot know the reader's theme. A dark card with light type
       reads the same on the light and the dark canvas; the border keeps the edge
       visible where the canvas is also dark. No external fonts, no script. -->
  <rect x="1.5" y="1.5" width="1197" height="297" rx="24" fill="#1c2128" stroke="#30363d" stroke-width="3"/>

  <!-- Mark: a pan seen from above with an egg in it, drawn from primitives so it
       renders identically everywhere. An emoji glyph would not. -->
  <g>
    <rect x="92" y="139" width="76" height="22" rx="11" fill="#8b949e"/>
    <circle cx="230" cy="150" r="72" fill="#262c34" stroke="#8b949e" stroke-width="7"/>
    <ellipse cx="230" cy="152" rx="47" ry="38" fill="#f6f8fa"/>
    <ellipse cx="258" cy="133" rx="21" ry="16" fill="#f6f8fa"/>
    <ellipse cx="203" cy="171" rx="19" ry="14" fill="#f6f8fa"/>
    <circle cx="230" cy="147" r="19" fill="#f0b429"/>
    <circle cx="223" cy="141" r="5.5" fill="#f8d477"/>
  </g>

  <text x="360" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-1.5" fill="#e6edf3">Omelette<tspan fill="#f0b429"> Fleet</tspan></text>

  <text x="363" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#9aa4b2">Gemini, Grok and Codex as read-only units in Claude Code</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fleet-topology-title fleet-topology-desc">
  <title id="fleet-topology-title">Omelette Fleet topology</title>
  <desc id="fleet-topology-desc">Architecture diagram: a Claude Code session calls three stdio MCP servers, each of which spawns one vendor CLI (agy, grok, codex); the servers read config from and write the status feed and result spool to the fleet home, and the units return text only — the session is the only thing that writes code.</desc>
  <defs>
    <marker id="ft-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6187"/></marker>
    <marker id="ft-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b8860b"/></marker>
    <marker id="ft-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f6f9c"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f3f3f1"/>

  <!-- ===== Zones (painted first) ===== -->
  <rect x="312" y="104" width="280" height="312" rx="8" fill="#012357" fill-opacity="0.02" stroke="#012357" stroke-opacity="0.10" stroke-width="0.8"/>
  <rect x="378" y="108" width="148" height="12" rx="2" fill="#f3f3f1"/>
  <text x="452" y="117" fill="#012357" fill-opacity="0.45" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">ONE STDIO SERVER PER UNIT</text>

  <rect x="656" y="104" width="264" height="312" rx="8" fill="#012357" fill-opacity="0.02" stroke="#012357" stroke-opacity="0.10" stroke-width="0.8"/>
  <rect x="722" y="108" width="132" height="12" rx="2" fill="#f3f3f1"/>
  <text x="788" y="117" fill="#012357" fill-opacity="0.45" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">VENDOR CLIs · HEADLESS</text>

  <!-- ===== Arrows (before boxes) ===== -->
  <!-- Session -> each unit server (tool call over stdio) -->
  <path d="M 240,244 H 264 Q 272,244 272,236 V 172 Q 272,164 280,164 H 328" fill="none" stroke="#1f6f9c" stroke-width="1.2" marker-end="url(#ft-arrow-link)"/>
  <line x1="240" y1="260" x2="328" y2="260" stroke="#1f6f9c" stroke-width="1.2" marker-end="url(#ft-arrow-link)"/>
  <path d="M 240,276 H 264 Q 272,276 272,284 V 348 Q 272,356 280,356 H 328" fill="none" stroke="#1f6f9c" stroke-width="1.2" marker-end="url(#ft-arrow-link)"/>

  <!-- Units -> session: answers only (accent, dashed) -->
  <path d="M 452,104 V 88 Q 452,80 444,80 H 148 Q 140,80 140,88 V 216" fill="none" stroke="#b8860b" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ft-arrow-accent)"/>

  <!-- Each server spawns its vendor CLI -->
  <line x1="576" y1="164" x2="672" y2="164" stroke="#4a6187" stroke-width="1.2" marker-end="url(#ft-arrow)"/>
  <line x1="576" y1="260" x2="672" y2="260" stroke="#4a6187" stroke-width="1.2" marker-end="url(#ft-arrow)"/>
  <line x1="576" y1="356" x2="672" y2="356" stroke="#4a6187" stroke-width="1.2" marker-end="url(#ft-arrow)"/>

  <!-- Fleet home: written per call, re-read per call -->
  <line x1="428" y1="416" x2="428" y2="456" stroke="#4a6187" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ft-arrow)"/>
  <line x1="476" y1="456" x2="476" y2="416" stroke="#4a6187" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ft-arrow)"/>

  <!-- ===== Arrow labels (masked, clear of their strokes) ===== -->
  <rect x="236" y="60" width="120" height="12" rx="2" fill="#f3f3f1"/>
  <text x="296" y="69" fill="#8a6200" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ANSWERS · TEXT ONLY</text>

  <rect x="600" y="240" width="48" height="12" rx="2" fill="#f3f3f1"/>
  <text x="624" y="249" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SPAWN</text>

  <rect x="314" y="430" width="92" height="12" rx="2" fill="#f3f3f1"/>
  <text x="360" y="439" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STATUS · SPOOL</text>

  <rect x="498" y="430" width="48" height="12" rx="2" fill="#f3f3f1"/>
  <text x="522" y="439" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CONFIG</text>

  <!-- ===== Nodes ===== -->
  <!-- Claude Code session (focal) -->
  <rect x="40" y="216" width="200" height="88" rx="6" fill="#f3f3f1"/>
  <rect x="40" y="216" width="200" height="88" rx="6" fill="#fac440" fill-opacity="0.20" stroke="#b8860b" stroke-width="1.4"/>
  <rect x="48" y="222" width="48" height="12" rx="2" fill="none" stroke="#b8860b" stroke-opacity="0.55" stroke-width="0.8"/>
  <text x="72" y="231" fill="#8a6200" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SESSION</text>
  <text x="140" y="264" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Claude Code</text>
  <text x="140" y="280" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">MCP client</text>
  <text x="140" y="296" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">the only writer</text>

  <!-- Unit server: gemini -->
  <rect x="328" y="136" width="248" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="328" y="136" width="248" height="56" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <rect x="336" y="142" width="32" height="12" rx="2" fill="none" stroke="#012357" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="352" y="151" fill="#012357" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
  <text x="452" y="170" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Gemini unit</text>
  <text x="452" y="184" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">servers/gemini.mjs</text>

  <!-- Unit server: grok -->
  <rect x="328" y="232" width="248" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="328" y="232" width="248" height="56" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <rect x="336" y="238" width="32" height="12" rx="2" fill="none" stroke="#012357" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="352" y="247" fill="#012357" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
  <text x="452" y="266" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Grok unit</text>
  <text x="452" y="280" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">servers/grok.mjs</text>

  <!-- Unit server: codex -->
  <rect x="328" y="328" width="248" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="328" y="328" width="248" height="56" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <rect x="336" y="334" width="32" height="12" rx="2" fill="none" stroke="#012357" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="352" y="343" fill="#012357" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
  <text x="452" y="362" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Codex unit</text>
  <text x="452" y="376" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">servers/codex.mjs</text>

  <!-- Vendor CLI: agy -->
  <rect x="672" y="136" width="232" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="672" y="136" width="232" height="56" rx="6" fill="#012357" fill-opacity="0.03" stroke="#012357" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="680" y="142" width="28" height="12" rx="2" fill="none" stroke="#012357" stroke-opacity="0.22" stroke-width="0.8"/>
  <text x="694" y="151" fill="#64789a" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="788" y="170" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Antigravity</text>
  <text x="788" y="184" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">agy</text>

  <!-- Vendor CLI: grok -->
  <rect x="672" y="232" width="232" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="672" y="232" width="232" height="56" rx="6" fill="#012357" fill-opacity="0.03" stroke="#012357" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="680" y="238" width="28" height="12" rx="2" fill="none" stroke="#012357" stroke-opacity="0.22" stroke-width="0.8"/>
  <text x="694" y="247" fill="#64789a" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="788" y="266" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Grok Build</text>
  <text x="788" y="280" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">grok</text>

  <!-- Vendor CLI: codex -->
  <rect x="672" y="328" width="232" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="672" y="328" width="232" height="56" rx="6" fill="#012357" fill-opacity="0.03" stroke="#012357" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="680" y="334" width="28" height="12" rx="2" fill="none" stroke="#012357" stroke-opacity="0.22" stroke-width="0.8"/>
  <text x="694" y="343" fill="#64789a" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="788" y="362" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Codex CLI</text>
  <text x="788" y="376" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">codex</text>

  <!-- Fleet home -->
  <rect x="304" y="456" width="296" height="96" rx="6" fill="#f3f3f1"/>
  <rect x="304" y="456" width="296" height="96" rx="6" fill="#012357" fill-opacity="0.05" stroke="#4a6187" stroke-width="1"/>
  <rect x="312" y="462" width="40" height="12" rx="2" fill="none" stroke="#4a6187" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="332" y="471" fill="#4a6187" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HOME</text>
  <text x="452" y="494" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Fleet home · $OMELETTE_HOME</text>
  <text x="452" y="512" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">fleet.config.json</text>
  <text x="452" y="528" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">status-&lt;unit&gt;.json · fleet-log.ndjson</text>
  <text x="452" y="544" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">results/&lt;unit&gt;/</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="584" x2="960" y2="584" stroke="#012357" stroke-opacity="0.12" stroke-width="0.8"/>
  <text x="40" y="600" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="40" y="612" width="14" height="10" rx="2" fill="#fac440" fill-opacity="0.20" stroke="#b8860b" stroke-width="1"/>
  <text x="60" y="620" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Session (applies)</text>

  <rect x="180" y="612" width="14" height="10" rx="2" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="200" y="620" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">MCP server</text>

  <rect x="300" y="612" width="14" height="10" rx="2" fill="#012357" fill-opacity="0.03" stroke="#012357" stroke-opacity="0.30" stroke-width="1"/>
  <text x="320" y="620" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Vendor CLI</text>

  <line x1="420" y1="617" x2="448" y2="617" stroke="#1f6f9c" stroke-width="1.2" marker-end="url(#ft-arrow-link)"/>
  <text x="456" y="620" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Tool call · stdio</text>

  <line x1="580" y1="617" x2="608" y2="617" stroke="#b8860b" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ft-arrow-accent)"/>
  <text x="616" y="620" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Answers · text only</text>

  <line x1="756" y1="617" x2="784" y2="617" stroke="#4a6187" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ft-arrow)"/>
  <text x="792" y="620" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Fleet home I/O</text>
</svg>

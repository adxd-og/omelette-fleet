<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="call-path-title call-path-desc">
  <title id="call-path-title">The path of one tool call</title>
  <desc id="call-path-desc">Sequence diagram: Claude Code sends a tools/call to the unit runtime, which resolves every config key and the write ceiling, opens a status entry, and asks core/spawn.mjs for one bounded child process whose environment is built from an allowlist with the billing keys scrubbed; the vendor CLI runs, the tail of its stdout comes back, the adapter parses it, and the status entry is closed and the answer spooled before the MCP response is sent. An expired timeoutS — or a cancellation when the unit is set to cancel: kill — SIGKILLs the whole process group, and any text already captured is kept and marked partial.</desc>
  <defs>
    <marker id="cp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6187"/></marker>
    <marker id="cp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b8860b"/></marker>
    <marker id="cp-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f6f9c"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f3f3f1"/>

  <!-- ===== Lifelines ===== -->
  <line x1="104" y1="120" x2="104" y2="648" stroke="#012357" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="304" y1="120" x2="304" y2="648" stroke="#012357" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="504" y1="120" x2="504" y2="648" stroke="#012357" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="688" y1="120" x2="688" y2="648" stroke="#012357" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="888" y1="120" x2="888" y2="648" stroke="#012357" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== Activation bars ===== -->
  <rect x="300" y="156" width="8" height="476" fill="#012357" fill-opacity="0.06" stroke="#4a6187" stroke-width="0.8"/>
  <rect x="500" y="276" width="8" height="236" fill="#012357" fill-opacity="0.06" stroke="#4a6187" stroke-width="0.8"/>
  <rect x="684" y="364" width="8" height="116" fill="#012357" fill-opacity="0.06" stroke="#4a6187" stroke-width="0.8"/>

  <!-- ===== opt fragment: the cancel / timeout branch ===== -->
  <rect x="492" y="376" width="208" height="80" rx="4" fill="#012357" fill-opacity="0.02" stroke="#012357" stroke-opacity="0.22" stroke-width="1"/>
  <rect x="492" y="376" width="40" height="16" rx="2" fill="#f3f3f1" stroke="#012357" stroke-opacity="0.22" stroke-width="1"/>
  <text x="512" y="388" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
  <rect x="500" y="394" width="184" height="12" rx="2" fill="#f3f3f1"/>
  <text x="504" y="403" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.04em">[wall-clock timeout]</text>

  <!-- ===== Messages (time flows down) ===== -->
  <!-- m1 tools/call -->
  <line x1="104" y1="152" x2="300" y2="152" stroke="#1f6f9c" stroke-width="1.2" marker-end="url(#cp-arrow-link)"/>
  <!-- m2 validate args + resolve config (ceiling) -->
  <path d="M 308,184 L 344,184 L 344,208 L 308,208" fill="none" stroke="#4a6187" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
  <!-- m3 status start -->
  <line x1="308" y1="240" x2="888" y2="240" stroke="#4a6187" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
  <!-- m4 spawn -->
  <line x1="308" y1="272" x2="500" y2="272" stroke="#4a6187" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
  <!-- m5 build child env -->
  <path d="M 508,304 L 544,304 L 544,328 L 508,328" fill="none" stroke="#4a6187" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
  <!-- m6 exec -->
  <line x1="508" y1="360" x2="684" y2="360" stroke="#4a6187" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
  <!-- m7 SIGKILL (inside opt) -->
  <line x1="508" y1="432" x2="684" y2="432" stroke="#4a6187" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
  <!-- m8 stdout tail back -->
  <line x1="684" y1="480" x2="508" y2="480" stroke="#4a6187" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cp-arrow)"/>
  <!-- m9 run result back -->
  <line x1="500" y1="512" x2="308" y2="512" stroke="#4a6187" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cp-arrow)"/>
  <!-- m10 adapter parses -->
  <path d="M 308,544 L 344,544 L 344,568 L 308,568" fill="none" stroke="#4a6187" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
  <!-- m11 status end + spool -->
  <line x1="308" y1="600" x2="888" y2="600" stroke="#4a6187" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
  <!-- m12 MCP response (headline) -->
  <line x1="300" y1="632" x2="104" y2="632" stroke="#b8860b" stroke-width="1.6" marker-end="url(#cp-arrow-accent)"/>

  <!-- ===== Message labels ===== -->
  <rect x="166" y="132" width="72" height="12" rx="2" fill="#f3f3f1"/>
  <text x="202" y="141" fill="#1f6f9c" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS/CALL</text>

  <rect x="352" y="190" width="116" height="12" rx="2" fill="#f3f3f1"/>
  <text x="410" y="199" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CONFIG · CEILING</text>

  <rect x="556" y="220" width="84" height="12" rx="2" fill="#f3f3f1"/>
  <text x="598" y="229" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STATUS START</text>

  <rect x="380" y="252" width="48" height="12" rx="2" fill="#f3f3f1"/>
  <text x="404" y="261" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SPAWN</text>

  <rect x="552" y="310" width="112" height="12" rx="2" fill="#f3f3f1"/>
  <text x="608" y="319" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ALLOWLIST · SCRUB</text>

  <rect x="546" y="340" width="100" height="12" rx="2" fill="#f3f3f1"/>
  <text x="596" y="349" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">EXEC · OWN PGID</text>

  <rect x="554" y="412" width="84" height="12" rx="2" fill="#f3f3f1"/>
  <text x="596" y="421" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SIGKILL PGID</text>

  <rect x="532" y="460" width="128" height="12" rx="2" fill="#f3f3f1"/>
  <text x="596" y="469" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STDOUT TAIL · KEPT</text>

  <rect x="368" y="492" width="72" height="12" rx="2" fill="#f3f3f1"/>
  <text x="404" y="501" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RUN RESULT</text>

  <rect x="352" y="550" width="132" height="12" rx="2" fill="#f3f3f1"/>
  <text x="418" y="559" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">PARSE · PARTIAL MARK</text>

  <rect x="540" y="580" width="116" height="12" rx="2" fill="#f3f3f1"/>
  <text x="598" y="589" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STATUS END · SPOOL</text>

  <rect x="162" y="612" width="80" height="12" rx="2" fill="#f3f3f1"/>
  <text x="202" y="621" fill="#8a6200" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MCP CONTENT</text>

  <!-- ===== Actors ===== -->
  <rect x="40" y="64" width="128" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="40" y="64" width="128" height="56" rx="6" fill="#4a6187" fill-opacity="0.10" stroke="#64789a" stroke-width="1"/>
  <rect x="48" y="70" width="44" height="12" rx="2" fill="none" stroke="#64789a" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="70" y="79" fill="#64789a" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
  <text x="104" y="98" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Claude Code</text>
  <text x="104" y="112" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">MCP client</text>

  <rect x="216" y="64" width="176" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="216" y="64" width="176" height="56" rx="6" fill="#fac440" fill-opacity="0.20" stroke="#b8860b" stroke-width="1.4"/>
  <rect x="224" y="70" width="44" height="12" rx="2" fill="none" stroke="#b8860b" stroke-opacity="0.55" stroke-width="0.8"/>
  <text x="246" y="79" fill="#8a6200" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
  <text x="304" y="98" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Unit server</text>
  <text x="304" y="112" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">core/unit.mjs</text>

  <rect x="424" y="64" width="160" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="424" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <rect x="432" y="70" width="36" height="12" rx="2" fill="none" stroke="#012357" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="450" y="79" fill="#012357" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
  <text x="504" y="98" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Spawn</text>
  <text x="504" y="112" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">core/spawn.mjs</text>

  <rect x="616" y="64" width="144" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="616" y="64" width="144" height="56" rx="6" fill="#012357" fill-opacity="0.03" stroke="#012357" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="624" y="70" width="28" height="12" rx="2" fill="none" stroke="#012357" stroke-opacity="0.22" stroke-width="0.8"/>
  <text x="638" y="79" fill="#64789a" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="688" y="98" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Vendor CLI</text>
  <text x="688" y="112" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">agy · grok · codex</text>

  <rect x="808" y="64" width="160" height="56" rx="6" fill="#f3f3f1"/>
  <rect x="808" y="64" width="160" height="56" rx="6" fill="#012357" fill-opacity="0.05" stroke="#4a6187" stroke-width="1"/>
  <rect x="816" y="70" width="40" height="12" rx="2" fill="none" stroke="#4a6187" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="836" y="79" fill="#4a6187" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HOME</text>
  <text x="888" y="98" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Fleet home</text>
  <text x="888" y="112" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">$OMELETTE_HOME</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="680" x2="960" y2="680" stroke="#012357" stroke-opacity="0.12" stroke-width="0.8"/>
  <text x="40" y="696" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="40" y="704" width="14" height="10" rx="2" fill="#fac440" fill-opacity="0.20" stroke="#b8860b" stroke-width="1"/>
  <text x="60" y="712" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Focal actor</text>

  <line x1="160" y1="709" x2="188" y2="709" stroke="#1f6f9c" stroke-width="1.2" marker-end="url(#cp-arrow-link)"/>
  <text x="196" y="712" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">MCP request</text>

  <line x1="296" y1="709" x2="324" y2="709" stroke="#4a6187" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
  <text x="332" y="712" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Call</text>

  <line x1="400" y1="709" x2="428" y2="709" stroke="#4a6187" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cp-arrow)"/>
  <text x="436" y="712" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Return</text>

  <line x1="516" y1="709" x2="544" y2="709" stroke="#b8860b" stroke-width="1.6" marker-end="url(#cp-arrow-accent)"/>
  <text x="552" y="712" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Primary response</text>

  <rect x="680" y="704" width="14" height="10" rx="2" fill="#012357" fill-opacity="0.02" stroke="#012357" stroke-opacity="0.22" stroke-width="1"/>
  <text x="700" y="712" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">opt — branch taken on timeout</text>
</svg>

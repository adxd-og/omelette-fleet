      <desc id="managed-files-desc">Data flow of the files the CLI renders. The workflow, agents and handoff blocks of fleet.config.json and the package templates feed three render commands, each stamping a version marker on line 1: rules writes the rules file (filling {{merge}}), rules --agents writes the four agent definitions and the /omelette-test skill (filling {{model}}, {{effort}} and {{maxTurns}}), and rules --hooks writes the guard script with handoff.enabled substituted into it. The rules file loads at the next session start; agent definitions and the skill are picked up by Claude Code's watcher, usually within seconds, sometimes minutes, with a restart if the directory is new; the guard script works as soon as your settings call it, from the snippet you paste. The contract block is not rendered: a unit server resolves it at start from the rules marker, so it reaches the session on the next Claude Code restart. doctor reads back each kind's marker, the handoff value from the installed script and the merge sentence from the rules file, and update prints the refresh command when a marked file is behind the installed package.</desc>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The operating model · omelette-fleet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f3f3f1;
      --color-ink:    #012357;
      --color-muted:  #4a6187;
      --color-accent: #fac440;
      --font-sans:   Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-serif:  'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:   'Geist Mono', 'SF Mono', Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · omelette-fleet</p>
    <h1>The operating model</h1>

    <svg viewBox="0 0 1000 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="operating-model-title operating-model-desc">
      <title id="operating-model-title">The operating model, lane by lane</title>
      <desc id="operating-model-desc">Swimlane diagram with five lanes — operator, session, omelette-coder, omelette-tester and the fleet units. The operator approves the spec; the session plans and briefs; the coder implements and reports a diff without ever committing; the session dispatches the tester with the spec and the diff; the tester runs the real runner; the session arbitrates test against spec and sends fix rounds back; the fleet units review; and only the session lane holds the commit and merge step, with the operator approving the push and tag.</desc>
      <defs>
        <marker id="om-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6187"/></marker>
        <marker id="om-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b8860b"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f3f3f1"/>

      <!-- ===== Lane grid ===== -->
      <line x1="40" y1="64" x2="960" y2="64" stroke="rgba(1,35,87,0.22)" stroke-width="1"/>
      <line x1="40" y1="144" x2="960" y2="144" stroke="rgba(1,35,87,0.12)" stroke-width="1"/>
      <line x1="40" y1="224" x2="960" y2="224" stroke="rgba(1,35,87,0.12)" stroke-width="1"/>
      <line x1="40" y1="304" x2="960" y2="304" stroke="rgba(1,35,87,0.12)" stroke-width="1"/>
      <line x1="40" y1="384" x2="960" y2="384" stroke="rgba(1,35,87,0.12)" stroke-width="1"/>
      <line x1="40" y1="464" x2="960" y2="464" stroke="rgba(1,35,87,0.22)" stroke-width="1"/>
      <line x1="176" y1="64" x2="176" y2="464" stroke="rgba(1,35,87,0.22)" stroke-width="1"/>

      <text x="52" y="108" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">OPERATOR</text>
      <text x="52" y="188" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">SESSION</text>
      <text x="52" y="268" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">OMELETTE-CODER</text>
      <text x="52" y="348" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">OMELETTE-TESTER</text>
      <text x="52" y="428" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">FLEET UNITS</text>

      <!-- ===== Arrows (drawn before the steps) ===== -->
      <line x1="264" y1="128" x2="264" y2="160" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
      <line x1="300" y1="208" x2="300" y2="240" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
      <line x1="420" y1="240" x2="420" y2="208" stroke="#b8860b" stroke-width="1.6" marker-end="url(#om-arrow-accent)"/>
      <line x1="530" y1="208" x2="530" y2="320" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
      <line x1="632" y1="320" x2="632" y2="208" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
      <path d="M 672,160 V 112 Q 672,104 664,104 H 368 Q 360,104 360,112 V 240" fill="none" stroke="#4a6187" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#om-arrow)"/>
      <line x1="736" y1="208" x2="736" y2="400" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
      <line x1="820" y1="400" x2="820" y2="208" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
      <line x1="900" y1="160" x2="900" y2="128" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>

      <!-- ===== Arrow labels ===== -->
      <rect x="468" y="84" width="96" height="12" rx="2" fill="#f3f3f1"/>
      <text x="516" y="93" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FIX ROUND ≤ 3</text>

      <rect x="242" y="218" width="48" height="12" rx="2" fill="#f3f3f1"/>
      <text x="266" y="227" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">BRIEF</text>

      <rect x="430" y="218" width="80" height="12" rx="2" fill="#f3f3f1"/>
      <text x="470" y="227" fill="#8a6200" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REPORTS DIFF</text>

      <rect x="540" y="258" width="76" height="12" rx="2" fill="#f3f3f1"/>
      <text x="578" y="267" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SPEC + DIFF</text>

      <rect x="642" y="258" width="84" height="12" rx="2" fill="#f3f3f1"/>
      <text x="684" y="267" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RUNNER OUTPUT</text>

      <rect x="746" y="258" width="64" height="12" rx="2" fill="#f3f3f1"/>
      <text x="778" y="267" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW</text>

      <rect x="830" y="258" width="72" height="12" rx="2" fill="#f3f3f1"/>
      <text x="866" y="267" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FINDINGS</text>

      <!-- ===== Steps ===== -->
      <!-- Operator: spec approved -->
      <rect x="192" y="80" width="152" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
      <text x="268" y="102" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Spec approved</text>
      <text x="268" y="116" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">before any build</text>

      <!-- Session: plan -->
      <rect x="192" y="160" width="152" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
      <text x="268" y="182" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Plan · brief</text>
      <text x="268" y="196" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">one job per agent</text>

      <!-- Coder: implement -->
      <rect x="280" y="240" width="160" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
      <text x="360" y="262" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Implement task</text>
      <text x="360" y="276" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">never commits</text>

      <!-- Session: dispatch tester -->
      <rect x="392" y="160" width="152" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
      <text x="468" y="182" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Dispatch tester</text>
      <text x="468" y="196" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">/omelette-test</text>

      <!-- Tester: run the suite -->
      <rect x="472" y="320" width="176" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
      <text x="560" y="342" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Run the suite</text>
      <text x="560" y="356" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">real runner · raw output</text>

      <!-- Session: arbitrate -->
      <rect x="592" y="160" width="152" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
      <text x="668" y="182" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Arbitrate</text>
      <text x="668" y="196" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">test vs spec</text>

      <!-- Fleet units: review -->
      <rect x="672" y="400" width="176" height="48" rx="6" fill="rgba(1,35,87,0.03)" stroke="rgba(1,35,87,0.30)" stroke-width="1"/>
      <text x="760" y="422" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Independent review</text>
      <text x="760" y="436" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">codex · grok · read-only</text>

      <!-- Session: commit + merge (focal) -->
      <rect x="792" y="160" width="168" height="48" rx="6" fill="rgba(250,196,64,0.20)" stroke="#b8860b" stroke-width="1.4"/>
      <text x="876" y="182" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Commit · merge</text>
      <text x="876" y="196" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">only this lane</text>

      <!-- Operator: push / tag -->
      <rect x="792" y="80" width="168" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
      <text x="876" y="102" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Approves push · tag</text>
      <text x="876" y="116" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">and the release</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="496" x2="960" y2="496" stroke="rgba(1,35,87,0.12)" stroke-width="0.8"/>
      <text x="40" y="512" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="528" width="14" height="10" rx="2" fill="#ffffff" stroke="#012357" stroke-width="1"/>
      <text x="60" y="536" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Step</text>

      <rect x="120" y="528" width="14" height="10" rx="2" fill="rgba(250,196,64,0.20)" stroke="#b8860b" stroke-width="1"/>
      <text x="140" y="536" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Session-only commit</text>

      <line x1="280" y1="533" x2="308" y2="533" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
      <text x="316" y="536" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Handoff</text>

      <line x1="400" y1="533" x2="428" y2="533" stroke="#b8860b" stroke-width="1.6" marker-end="url(#om-arrow-accent)"/>
      <text x="436" y="536" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A diff comes back, never a commit</text>

      <line x1="700" y1="533" x2="728" y2="533" stroke="#4a6187" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#om-arrow)"/>
      <text x="736" y="536" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Fix round</text>
    </svg>
  </div>
</body>
</html>

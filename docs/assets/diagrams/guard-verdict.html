    <h1>The guard, from the event on stdin to an exit code</h1>

    <svg viewBox="0 0 1000 884" width="1000" height="884" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="guard-verdict-title guard-verdict-desc">
      <title id="guard-verdict-title">The guard hook, from stdin event to exit code</title>
      <desc id="guard-verdict-desc">Flowchart of the guard script that rules --hooks writes, as it stands since 1.8.0. It reads the event on stdin, at most 8 MiB and giving up after 5 s; malformed or oversized stdin, or a pipe that never closes, exits 0, a fail-open by design on a PreToolUse event past 8 MiB. It serves four events. On PreToolUse (matcher Bash|Write|Edit|NotebookEdit) it asks four questions in order, and each yes exits 2 with one stderr line saying why, so the call never runs: a Bash command whose brackets spend the 1 MiB scan budget (TOO_DEEP), for every caller, the main thread included; a Bash command that truncates a curated file, or a Write that is not an append to one, for every caller, the curated files being .omelette/ledger-*.md, .omelette/backlog.md, .omelette/decisions.md and the file the register's first line register: names; omelette-reviewer writing with Write, Edit or NotebookEdit anywhere but .omelette/reports/&lt;name&gt;-review.md, symlinks followed; and a git write, per the grammar table in SECURITY, by one of the six guarded roles, omelette-coder, omelette-coder-medium, omelette-coder-hard, omelette-coder-xhard, omelette-tester and omelette-reviewer. Every other call, every read included, exits 0. On PreCompact, when a .omelette/ledger-*.md exists, it runs the ledger sweep, then stamps each open or untracked ledger with a ## Compaction line and prints a one-line handoff reminder. On SessionStart it runs the sweep on every source when a ledger exists, and on compact or clear only prints one JSON context entry, additionalContext led by the line --- omelette-fleet · read before continuing ---, holding each ledger's last handoff, the decisions register and the backlog's first table, 12 KB in all; startup, resume and fork print nothing. On SubagentStop, when a guarded role stops, it writes .omelette/reports/touched-&lt;role&gt;-&lt;id8&gt;.md, the paths the agent wrote and its tool calls read from its own transcript, and prints and refuses nothing. These three events never refuse, and handoff.enabled=false turns the sweep, the stamp and the print off. The retired PostToolUse, Stop and PostCompact events and any unknown event exit 0. Two deliveries run the one script: the settings hook on the four events, and the fleet pane mod, whose tool.call hook runs the same rendered script first on a Bash, Write, Edit or NotebookEdit call and denies the call when it exits 2.</desc>

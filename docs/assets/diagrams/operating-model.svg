<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="operating-model-title operating-model-desc">
  <title id="operating-model-title">The operating model, lane by lane</title>
  <desc id="operating-model-desc">Swimlane diagram with six lanes — operator, session, omelette-coder, omelette-tester, omelette-reviewer and the fleet units. The operator approves the spec; the session plans and briefs; the coder implements and reports a diff without ever committing; the session dispatches the tester with the spec and the git diff, through the /omelette-test skill or by hand under Claude Code's auto permission mode; the tester runs the real runner; the session arbitrates test against spec and sends fix rounds back; omelette-reviewer, which writes only its report, and the fleet units review and return findings; and only the session lane holds the commit and merge step, with the operator approving the push and tag.</desc>
  <defs>
    <marker id="om-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6187"/></marker>
    <marker id="om-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b8860b"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f3f3f1"/>

  <!-- ===== Lane grid ===== -->
  <line x1="40" y1="64" x2="960" y2="64" stroke="#012357" stroke-opacity="0.22" stroke-width="1"/>
  <line x1="40" y1="144" x2="960" y2="144" stroke="#012357" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="40" y1="224" x2="960" y2="224" stroke="#012357" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="40" y1="304" x2="960" y2="304" stroke="#012357" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="40" y1="384" x2="960" y2="384" stroke="#012357" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="40" y1="464" x2="960" y2="464" stroke="#012357" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="40" y1="544" x2="960" y2="544" stroke="#012357" stroke-opacity="0.22" stroke-width="1"/>
  <line x1="176" y1="64" x2="176" y2="544" stroke="#012357" stroke-opacity="0.22" stroke-width="1"/>

  <text x="52" y="108" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">OPERATOR</text>
  <text x="52" y="188" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">SESSION</text>
  <text x="52" y="268" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">OMELETTE-CODER</text>
  <text x="52" y="348" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">OMELETTE-TESTER</text>
  <text x="52" y="428" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">OMELETTE-REVIEWER</text>
  <text x="52" y="508" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">FLEET UNITS</text>

  <!-- ===== Arrows (drawn before the steps) ===== -->
  <line x1="264" y1="128" x2="264" y2="160" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
  <line x1="284" y1="208" x2="284" y2="240" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
  <line x1="392" y1="240" x2="392" y2="208" stroke="#b8860b" stroke-width="1.6" marker-end="url(#om-arrow-accent)"/>
  <line x1="488" y1="208" x2="488" y2="320" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
  <line x1="592" y1="320" x2="592" y2="208" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
  <path d="M 690,160 V 112 Q 690,104 682,104 H 356 Q 348,104 348,112 V 240" fill="none" stroke="#4a6187" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#om-arrow)"/>
  <path d="M 704,172 H 752 V 400" fill="none" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
  <path d="M 704,196 H 724 V 480" fill="none" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
  <line x1="860" y1="400" x2="860" y2="208" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
  <path d="M 760,504 H 920 V 208" fill="none" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
  <line x1="900" y1="160" x2="900" y2="128" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>

  <!-- ===== Arrow labels ===== -->
  <rect x="468" y="84" width="96" height="12" rx="2" fill="#f3f3f1"/>
  <text x="516" y="93" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FIX ROUND ≤ 3</text>

  <rect x="290" y="218" width="48" height="12" rx="2" fill="#f3f3f1"/>
  <text x="314" y="227" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">BRIEF</text>

  <rect x="398" y="218" width="80" height="12" rx="2" fill="#f3f3f1"/>
  <text x="438" y="227" fill="#8a6200" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REPORTS DIFF</text>

  <rect x="494" y="250" width="92" height="12" rx="2" fill="#f3f3f1"/>
  <text x="540" y="259" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SPEC + GIT DIFF</text>

  <rect x="598" y="282" width="84" height="12" rx="2" fill="#f3f3f1"/>
  <text x="640" y="291" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RUNNER OUTPUT</text>

  <rect x="758" y="338" width="48" height="12" rx="2" fill="#f3f3f1"/>
  <text x="782" y="347" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW</text>

  <rect x="670" y="418" width="48" height="12" rx="2" fill="#f3f3f1"/>
  <text x="694" y="427" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW</text>

  <rect x="798" y="244" width="56" height="26" rx="2" fill="#f3f3f1"/>
  <text x="826" y="253" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FINDINGS</text>
  <text x="826" y="266" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">+ VERDICT</text>

  <rect x="812" y="486" width="56" height="12" rx="2" fill="#f3f3f1"/>
  <text x="840" y="495" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FINDINGS</text>

  <!-- ===== Steps ===== -->
  <!-- Operator: spec approved -->
  <rect x="192" y="80" width="144" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="264" y="102" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Spec approved</text>
  <text x="264" y="116" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">before any build</text>

  <!-- Session: plan -->
  <rect x="192" y="160" width="144" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="264" y="182" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Plan · brief</text>
  <text x="264" y="196" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">one job per agent</text>

  <!-- Coder: implement -->
  <rect x="256" y="240" width="168" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="340" y="262" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Implement task</text>
  <text x="340" y="276" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">never commits</text>

  <!-- Session: dispatch tester — the skill, or by hand where auto mode refuses it -->
  <rect x="360" y="160" width="144" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="432" y="180" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Dispatch tester</text>
  <text x="432" y="193" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">the skill, or by hand</text>
  <text x="432" y="203" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">under auto mode</text>

  <!-- Tester: run the suite -->
  <rect x="440" y="320" width="160" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="520" y="342" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Run the suite</text>
  <text x="520" y="356" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">real runner · raw output</text>

  <!-- Session: arbitrate -->
  <rect x="528" y="160" width="176" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="616" y="182" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Arbitrate</text>
  <text x="616" y="196" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">test vs spec</text>

  <!-- Reviewer: clean-context review -->
  <rect x="740" y="400" width="140" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="810" y="422" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Clean-context review</text>
  <text x="810" y="436" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">writes only its report</text>

  <!-- Fleet units: review -->
  <rect x="600" y="480" width="160" height="48" rx="6" fill="#012357" fill-opacity="0.03" stroke="#012357" stroke-opacity="0.30" stroke-width="1"/>
  <text x="680" y="502" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Independent review</text>
  <text x="680" y="516" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">codex · grok · read-only</text>

  <!-- Session: commit + merge (focal) -->
  <rect x="792" y="160" width="168" height="48" rx="6" fill="#fac440" fill-opacity="0.20" stroke="#b8860b" stroke-width="1.4"/>
  <text x="876" y="182" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Commit · merge</text>
  <text x="876" y="196" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">only this lane</text>

  <!-- Operator: push / tag -->
  <rect x="792" y="80" width="168" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="876" y="102" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Approves push · tag</text>
  <text x="876" y="116" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">and the release</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="576" x2="960" y2="576" stroke="#012357" stroke-opacity="0.12" stroke-width="0.8"/>
  <text x="40" y="592" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="40" y="608" width="14" height="10" rx="2" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="60" y="616" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Step</text>

  <rect x="120" y="608" width="14" height="10" rx="2" fill="#fac440" fill-opacity="0.20" stroke="#b8860b" stroke-width="1"/>
  <text x="140" y="616" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Session-only commit</text>

  <line x1="280" y1="613" x2="308" y2="613" stroke="#4a6187" stroke-width="1.2" marker-end="url(#om-arrow)"/>
  <text x="316" y="616" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Handoff</text>

  <line x1="400" y1="613" x2="428" y2="613" stroke="#b8860b" stroke-width="1.6" marker-end="url(#om-arrow-accent)"/>
  <text x="436" y="616" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A diff comes back, never a commit</text>

  <line x1="700" y1="613" x2="728" y2="613" stroke="#4a6187" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#om-arrow)"/>
  <text x="736" y="616" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Fix round</text>
</svg>

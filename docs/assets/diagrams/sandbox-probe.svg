  <text x="515" y="281" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
  <rect x="507" y="353" width="37" height="12" rx="2" fill="#f3f3f1"/>
  <text x="525" y="362" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FAILS</text>
  <rect x="144" y="542" width="22" height="12" rx="2" fill="#f3f3f1"/>
  <text x="155" y="551" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
  <rect x="345" y="635" width="27" height="12" rx="2" fill="#f3f3f1"/>
  <text x="350" y="644" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.12em">YES</text>
  <rect x="497" y="684" width="37" height="12" rx="2" fill="#f3f3f1"/>
  <text x="515" y="693" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FAILS</text>
  <rect x="537" y="790" width="27" height="12" rx="2" fill="#f3f3f1"/>

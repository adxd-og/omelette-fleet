  <line x1="340" y1="398" x2="340" y2="424" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <line x1="340" y1="494" x2="340" y2="520" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <path d="M 200,560 H 110 V 612" fill="none" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <line x1="110" y1="656" x2="110" y2="680" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <line x1="180" y1="702" x2="240" y2="702" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <line x1="340" y1="600" x2="340" y2="680" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <line x1="440" y1="702" x2="590" y2="702" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <line x1="340" y1="724" x2="340" y2="756" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>

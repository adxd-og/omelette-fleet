  <!-- ===== Arrow labels ===== -->
  <rect x="504" y="108" width="22" height="12" rx="2" fill="#f3f3f1"/>
  <text x="515" y="117" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
  <rect x="504" y="190" width="22" height="12" rx="2" fill="#f3f3f1"/>
  <text x="515" y="199" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

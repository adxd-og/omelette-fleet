  <line x1="340" y1="860" x2="340" y2="888" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <line x1="510" y1="940" x2="590" y2="940" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <line x1="340" y1="992" x2="340" y2="1020" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <path d="M 850,702 H 900 V 1100" fill="none" stroke="#4a6187" stroke-width="1.2" marker-end="url(#sandbox-probe-arrow)"/>
  <path d="M 850,808 H 900" fill="none" stroke="#b8860b" stroke-width="1.6"/>

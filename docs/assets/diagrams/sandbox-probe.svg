  <text x="110" y="632" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">SIGKILL the group</text>
  <text x="110" y="646" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">the vendor's process group</text>
  <rect x="40" y="680" width="140" height="44" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="110" y="700" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">settle, at most 5 s</text>
  <text x="110" y="714" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">a write in flight counts</text>
  <!-- The verdict is the filesystem -->
  <rect x="240" y="680" width="200" height="44" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="340" y="700" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">read the directory</text>
  <text x="340" y="714" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">the verdict is the filesystem</text>
  <rect x="590" y="684" width="260" height="36" rx="18" fill="#012357" fill-opacity="0.05" stroke="#4a6187" stroke-width="1"/>
  <text x="720" y="706" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">skipped (could not inspect: …)</text>
  <polygon points="340,756 510,808 340,860 170,808" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="340" y="804" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">any entry, or the directory</text>
  <text x="340" y="818" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">gone or replaced?</text>
  <rect x="590" y="780" width="260" height="56" rx="28" fill="#fac440" fill-opacity="0.20" stroke="#b8860b" stroke-width="1.4"/>
  <text x="720" y="803" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">BREACHED</text>
  <text x="720" y="818" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">doctor exits 1</text>
  <text x="720" y="829" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">the printed path names the entry</text>
  <polygon points="340,888 510,940 340,992 170,940" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="340" y="936" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">did the call run to the end</text>
  <text x="340" y="950" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">with an answer?</text>
  <rect x="590" y="916" width="260" height="48" rx="24" fill="#012357" fill-opacity="0.05" stroke="#4a6187" stroke-width="1"/>
  <text x="720" y="936" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">skipped (timed out, or call failed)</text>
  <text x="720" y="951" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">timed out after N s · call failed: …</text>
  <rect x="240" y="1020" width="200" height="48" rx="24" fill="#012357" fill-opacity="0.03" stroke="#012357" stroke-opacity="0.30" stroke-width="1"/>
  <text x="340" y="1042" fill="#012357" font-size="12" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">held</text>
  <text x="340" y="1057" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">evidence about that one call</text>
  <!-- Every path that made a directory ends here -->
  <rect x="40" y="1100" width="920" height="48" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="500" y="1121" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">remove the directory</text>
  <text x="500" y="1137" fill="#4a6187" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">in every path, verdict or not</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="1180" x2="960" y2="1180" stroke="#012357" stroke-opacity="0.12" stroke-width="0.8"/>
  <text x="40" y="1196" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
  <rect x="40" y="1212" width="24" height="12" rx="6" fill="#012357" fill-opacity="0.03" stroke="#012357" stroke-opacity="0.30" stroke-width="1"/>
  <text x="72" y="1222" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Start / verdict (oval)</text>
  <rect x="220" y="1212" width="24" height="12" rx="2" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="252" y="1222" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Step (rectangle)</text>
  <polygon points="380,1218 392,1212 404,1218 392,1224" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="412" y="1222" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Decision (diamond)</text>
  <rect x="560" y="1212" width="24" height="12" rx="6" fill="#fac440" fill-opacity="0.20" stroke="#b8860b" stroke-width="1"/>
  <text x="592" y="1222" fill="#4a6187" font-size="9" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">BREACHED: doctor exits 1 · held and skipped move no exit code</text>
</svg>

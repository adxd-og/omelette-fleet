  <rect x="345" y="869" width="22" height="12" rx="2" fill="#f3f3f1"/>
  <text x="350" y="878" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.12em">NO</text>
  <rect x="539" y="922" width="22" height="12" rx="2" fill="#f3f3f1"/>
  <text x="550" y="931" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
  <rect x="345" y="1001" width="27" height="12" rx="2" fill="#f3f3f1"/>
  <text x="350" y="1010" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.12em">YES</text>
  <text x="40" y="796" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start">checked first:</text>
  <text x="40" y="807" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start">a file already written</text>
  <text x="40" y="818" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start">stays BREACHED</text>

  <!-- ===== Nodes ===== -->
  <!-- Start -->
  <rect x="230" y="28" width="220" height="48" rx="24" fill="#012357" fill-opacity="0.03" stroke="#012357" stroke-opacity="0.30" stroke-width="1"/>
  <text x="340" y="49" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">doctor --probe-sandbox</text>
  <text x="340" y="64" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">per unit · opt-in · one call each</text>
  <!-- Three gates, each a skip -->
  <polygon points="340,96 440,126 340,156 240,126" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="340" y="130" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">enabled?</text>
  <rect x="590" y="108" width="260" height="36" rx="18" fill="#012357" fill-opacity="0.05" stroke="#4a6187" stroke-width="1"/>
  <text x="720" y="130" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">skipped (disabled)</text>
  <polygon points="340,178 440,208 340,238 240,208" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="340" y="212" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">registered as ours?</text>
  <rect x="590" y="186" width="260" height="44" rx="22" fill="#012357" fill-opacity="0.05" stroke="#4a6187" stroke-width="1"/>
  <text x="720" y="205" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">skipped (not registered)</text>
  <text x="720" y="219" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">or (registered elsewhere): another clone</text>
  <polygon points="340,260 440,290 340,320 240,290" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="340" y="294" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">binary found?</text>
  <rect x="590" y="272" width="260" height="36" rx="18" fill="#012357" fill-opacity="0.05" stroke="#4a6187" stroke-width="1"/>
  <text x="720" y="294" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">skipped (binary not found)</text>
  <!-- The throwaway directory -->
  <rect x="220" y="344" width="240" height="54" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="340" y="364" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">mkdtemp 0700</text>
  <text x="340" y="379" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">omelette-probe-&lt;unit&gt;-&lt;random&gt;</text>
  <text x="340" y="390" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">under the OS temp directory</text>
  <rect x="590" y="353" width="260" height="36" rx="18" fill="#012357" fill-opacity="0.05" stroke="#4a6187" stroke-width="1"/>
  <text x="720" y="375" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">skipped (temp dir: …)</text>
  <!-- The one call -->
  <rect x="170" y="424" width="340" height="70" rx="6" fill="#ffffff" stroke="#012357" stroke-width="1"/>
  <text x="340" y="444" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">research tool with cwd = the directory,</text>
  <text x="340" y="458" fill="#012357" font-size="11" font-weight="600" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">cancel: kill, deadline min(timeoutS, 120 s)</text>
  <text x="340" y="474" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">prompt: create probe.txt there, reply done or refused</text>
  <text x="340" y="486" fill="#4a6187" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">the unit's own model, effort and mode</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sandbox-probe-title sandbox-probe-desc">
  <title id="sandbox-probe-title">doctor --probe-sandbox, from the gates to the verdict</title>
  <desc id="sandbox-probe-desc">Flowchart of doctor --probe-sandbox for one unit. A unit that is not enabled, not registered as ours (or registered elsewhere, against another clone) or whose binary is not found is skipped with that reason. Otherwise mkdtemp creates a 0700 directory, omelette-probe-&lt;unit&gt;-&lt;random&gt;, under the OS temp directory (a failure is skipped (temp dir: …)), and the unit's own research tool runs with cwd set to that directory, cancel: kill, and one deadline for the whole probe, min(timeoutS, 120 s), asked to create probe.txt and reply done or refused. A call that has not returned by the deadline has its process group SIGKILLed and is given at most 5 s to settle. Then the directory is read: any entry, or a directory gone or replaced, is BREACHED and doctor exits 1, so a file already written stays BREACHED; otherwise a call that ran to the end with an answer is held, and a timeout or a failed call is skipped. The directory is removed in every path, verdict or not.</desc>
  <defs>
    <marker id="sandbox-probe-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6187"/></marker>
    <marker id="sandbox-probe-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b8860b"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f3f3f1"/>


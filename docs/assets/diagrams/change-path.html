    <h1>Which path a change takes</h1>

    <svg viewBox="0 0 1000 936" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="change-path-title change-path-desc">
      <title id="change-path-title">Which path a change takes</title>
      <desc id="change-path-desc">Flowchart of the path a change takes before the operating model's lanes. A change of at most 20 lines, with no behaviour beyond the fix, its test in the same commit (or docs and comments only) and none of the six excluded areas (the guard's refusal logic, the env allowlist, the billing scrub, the write gates, a tool's schema, a doc section rewritten) takes the small-change lane: fix/&lt;name&gt; with its test, the suite green on Linux, fast-forward main and one ledger line, with no spec, plan, reviews or tag. Everything else goes through the flow: spec approved, then plan. Short of all four delegate conditions (independent, its own files or question; resolves a named uncertainty; a wrong answer would cost something material; the output fits one sentence) the session does it itself rather than paying a delegate's overhead, and the tester still runs (a docs-only edit needs none). Otherwise omelette-coder-medium takes the section when it prints the exact text, diff, tests and numbers, and omelette-coder takes it otherwise; a required decision left open gets NEEDS_CONTEXT at any effort. Then come the tester, review and the session's commit.</desc>

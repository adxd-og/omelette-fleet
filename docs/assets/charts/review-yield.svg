<title id="review-yield-title">Review yield per release</title>
<desc id="review-yield-desc">Review yield per release: stacked bars, one per release in release order, found = accepted + rejected, not changed or duplicate. 0.3.4 and 0.3.5 were reconstructed after the fact; the yield line is kept from 0.3.6 on. 0.3.4: found 33, accepted 32, rejected 1. 0.3.5: found 25, accepted 23, rejected 2. 0.3.6: found 27, accepted 25, rejected 2. 0.3.7: found 31, accepted 28, rejected 3. 1.0.0: found 10, accepted 8, rejected 2. 1.1.0: found 37, accepted 29, rejected 8. 1.2.0: found 24, accepted 17, rejected 7. 1.3.0: found 34, accepted 30, rejected 4. 1.4.0: found 53, accepted 49, rejected 4. 1.5.0: found 21, accepted 15, rejected 6. 1.6.0: found 43, accepted 38, rejected 5. 1.6.1: found 22, accepted 18, rejected 4. 1.6.2: found 15, accepted 13, rejected 2. 1.7.0: found 31, accepted 25, rejected 6. 1.7.1: found 20, accepted 18, rejected 2. 1.7.2: found 33, accepted 29, rejected 4. 1.7.3: found 53, accepted 39, rejected 14. 1.8.0: found 23, accepted 17, rejected 6. Across 18 releases: 535 findings, 453 accepted, 82 rejected, not changed or duplicate.</desc>

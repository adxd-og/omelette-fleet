<title id="r-accuracy-title">R: research answers that match the key</title>
<desc id="r-accuracy-desc">Correct answers out of 12 questions, and cited URLs that were unreachable or invented: the bar is over every question the arm was asked, a dot a run that asked them all. 2026-11-20 (13 arms; 3 carried from 2026-10-16) · N = 2 runs per arm · runs shown, no intervals. CLI versions: agy 1.5.13. Gemini 4 Hydrogen · High: Correct (of 12) 8.5 (runs 8, 9); Invented or unreachable URLs 0 (runs 0, 0). Gemini 4 Neon · Medium: Correct (of 12) 8 (runs 8, 8); Invented or unreachable URLs 0 (runs 0, 0). Gemini 4 Neon · High: Correct (of 12) 8 (runs 8, 8); Invented or unreachable URLs 0 (runs 0, 0).</desc>

<title id="r-accuracy-title">R: research answers that match the key</title>
<desc id="r-accuracy-desc">Correct answers out of 10 questions, and cited URLs that were unreachable or invented: the bar is the mean, each dot a run. 2026-10-16 · N = 1–2 runs per arm · runs shown, no intervals. CLI versions: agy 1.4.0, codex 0.162.1, grok 1.0.60. Gemini 3.8 Flash · Low: Correct (of 10) 9 (runs 9, 9); Invented or unreachable URLs 0 (runs 0, 0). Gemini 3.8 Flash · Medium: Correct (of 10) 9 (runs 9, 9); Invented or unreachable URLs 0 (runs 0, 0). Gemini 3.8 Flash · High: Correct (of 10) 8.5 (runs 8, 9); Invented or unreachable URLs 0 (runs 0, 0). Gemini 4 Argon · Low (one prompt for all questions): Correct (of 10) 8 (runs 8); Invented or unreachable URLs 0 (runs 0). Gemini 4 Argon · Medium (one prompt for all questions): Correct (of 10) 9 (runs 9); Invented or unreachable URLs 0 (runs 0). Gemini 4 Argon · High (one prompt for all questions): Correct (of 10) 9 (runs 9); Invented or unreachable URLs 0 (runs 0). Grok 4.7: Correct (of 10) 10 (runs 10, 10); Invented or unreachable URLs 0 (runs 0, 0). GPT-6.1 Sol · xhigh: Correct (of 10) 10 (runs 10, 10); Invented or unreachable URLs 0 (runs 0, 0). GPT-6 Astra · xhigh: Correct (of 10) 10 (runs 10, 10); Invented or unreachable URLs 0 (runs 0, 0).</desc>

<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="effort-title effort-desc" viewBox="0 0 760 430" width="760" height="430">
<title id="effort-title">Effort: Gemini scores at Low, Medium and High</title>
<desc id="effort-desc">Effort: Gemini scores at Low, Medium and High. 2026-10-21 (3 arms; 15 carried from 2026-10-16) · N = 1–2 runs per arm · runs shown, no intervals. CLI versions: agy 1.4.0, agy 1.4.4. R Gemini 3.8 Flash · Low: 90 % (runs 90 %, 90 %). R Gemini 3.8 Flash · Medium: 90 % (runs 90 %, 90 %). R Gemini 3.8 Flash · High: 85 % (runs 80 %, 90 %). R Gemini 4 Argon · Low: 80 % (runs 80 %). R Gemini 4 Argon · Medium: 90 % (runs 90 %). R Gemini 4 Argon · High: 80 % (runs 80 %). V Gemini 3.8 Flash · Low: 21 % (runs 14 %, 29 %). V Gemini 3.8 Flash · Medium: 43 % (runs 43 %, 43 %). V Gemini 3.8 Flash · High: 29 % (runs 29 %, 29 %). V Gemini 4 Argon · Low: 29 % (runs 29 %). V Gemini 4 Argon · Medium: 29 % (runs 29 %). V Gemini 4 Argon · High: 29 % (runs 29 %).</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}
.c1{fill:#2a78d6}.c2{fill:#eb6834}.c3{fill:#1baf7a}.k1{stroke:#2a78d6}.k2{stroke:#eb6834}.k3{stroke:#1baf7a}
.ring{stroke:#ffffff;stroke-width:2}.line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.run{fill-opacity:0.45}
@media (prefers-color-scheme: dark){
.t{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#2c2c2a}.base{stroke:#383835}
.c1{fill:#3987e5}.c2{fill:#d95926}.c3{fill:#199e70}.k1{stroke:#3987e5}.k2{stroke:#d95926}.k3{stroke:#199e70}
.ring{stroke:#0d1117}
}
</style>
<text class="t" x="16" y="26" font-size="16" font-weight="600">Effort: Gemini scores at Low, Medium and High</text>
<text class="t2" x="16" y="46" font-size="12">R: share of questions answered correctly · V: recall. The large point is the mean, the small ones the runs</text>
<text class="t2" x="16" y="66" font-size="12">2026-10-21 (3 arms; 15 carried from 2026-10-16) · N = 1–2 runs per arm · runs shown, no intervals</text>
<text class="t2" x="16" y="82" font-size="12">CLI versions: agy 1.4.0, agy 1.4.4</text>

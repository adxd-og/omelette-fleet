<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="effort-title effort-desc" viewBox="0 0 760 478" width="760" height="478">
<title id="effort-title">Effort: Gemini scores at each level</title>
<desc id="effort-desc">Effort: Gemini scores at each level. 2026-11-20 (13 arms; 3 carried from 2026-10-16) · N = 2–4 runs per arm. CLI versions: agy 1.5.13, agy 1.5.14. V Gemini 4 Hydrogen · High: incomplete, tasks per run 3, 3, 5, 5 of 8, 1 of the suite's tasks never run. V Gemini 4 Neon · High: incomplete, tasks per run 3, 2, 6, 5 of 8, 1 of the suite's tasks never run. V Gemini 4 Neon · XHigh: incomplete, tasks per run 1, 1 of 2, 7 of the suite's tasks never run. R Gemini 4 Hydrogen · High: 71 % (runs 67 %, 75 %). R Gemini 4 Neon · Medium: 67 % (runs 67 %, 67 %). R Gemini 4 Neon · High: 67 % (runs 67 %, 67 %). V Gemini 4 Hydrogen · High: 21 % (runs 29 %, 14 %, n/a, n/a). V Gemini 4 Neon · High: 36 % (runs 43 %, n/a, 29 %, n/a). V Gemini 4 Neon · XHigh: 43 % (runs n/a, 43 %).</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}
.c1{fill:#2a78d6}.c2{fill:#eb6834}.c3{fill:#1baf7a}.c4{fill:#8e56c8}.k1{stroke:#2a78d6}.k2{stroke:#eb6834}.k3{stroke:#1baf7a}.k4{stroke:#8e56c8}
.ring{stroke:#ffffff;stroke-width:2}.line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.run{fill-opacity:0.45}
@media (prefers-color-scheme: dark){
.t{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#2c2c2a}.base{stroke:#383835}
.c1{fill:#3987e5}.c2{fill:#d95926}.c3{fill:#199e70}.c4{fill:#a070dc}.k1{stroke:#3987e5}.k2{stroke:#d95926}.k3{stroke:#199e70}.k4{stroke:#a070dc}
.ring{stroke:#0d1117}
}
</style>
<text class="t" x="16" y="26" font-size="16" font-weight="600">Effort: Gemini scores at each level</text>
<text class="t2" x="16" y="46" font-size="12">R: share of questions answered correctly · V: recall. The large point is the mean, the small ones the runs</text>
<text class="t2" x="16" y="66" font-size="12">2026-11-20 (13 arms; 3 carried from 2026-10-16) · N = 2–4 runs per arm</text>
<text class="t2" x="16" y="82" font-size="12">CLI versions: agy 1.5.13, agy 1.5.14</text>
<text class="t2" x="16" y="98" font-size="12">V Gemini 4 Hydrogen · High: incomplete, tasks per run 3, 3, 5, 5 of 8, 1 of the suite's tasks never run</text>
<text class="t2" x="16" y="114" font-size="12">V Gemini 4 Neon · High: incomplete, tasks per run 3, 2, 6, 5 of 8, 1 of the suite's tasks never run</text>
<text class="t2" x="16" y="130" font-size="12">V Gemini 4 Neon · XHigh: incomplete, tasks per run 1, 1 of 2, 7 of the suite's tasks never run</text>

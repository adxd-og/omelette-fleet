<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v-recall-precision-title v-recall-precision-desc" viewBox="0 0 760 640" width="760" height="640">
<title id="v-recall-precision-title">V: review against a known-defect key</title>
<desc id="v-recall-precision-desc">Recall (key defects found, of 11) and precision (real findings over all findings) on the keyed tasks: the bar is over every keyed review the arm made, a dot a run that reviewed every task; the recall-only and control tasks are tables, not charts. 2026-11-20 (13 arms; 3 carried from 2026-10-16) · N = 1–4 runs per arm. CLI versions: agy 1.5.13, agy 1.5.14, codex 0.162.1, grok 1.0.60, unknown. carried from 2026-10-16, with that round's tasks and CLIs: Grok 4.7, GPT-6.1 Sol · xhigh, GPT-6 Astra · xhigh. V Claude Opus 5.5 · High: incomplete, tasks per run 2 of 2, 7 of the suite's tasks never run. V Gemini 4 Hydrogen · High: incomplete, tasks per run 3, 3, 5, 5 of 8, 1 of the suite's tasks never run. V Gemini 4 Neon · High: incomplete, tasks per run 3, 2, 6, 5 of 8, 1 of the suite's tasks never run. V Gemini 4 Neon · XHigh: incomplete, tasks per run 1, 1 of 2, 7 of the suite's tasks never run. Claude Opus 5.5 · High: Recall n/a (runs n/a); Precision n/a (runs n/a). Gemini 4 Hydrogen · High: Recall 21 % (runs none whole); Precision 50 % (runs none whole). Gemini 4 Neon · High: Recall 36 % (runs none whole); Precision 41 % (runs none whole). Gemini 4 Neon · XHigh: Recall 43 % (runs none whole); Precision 31 % (runs none whole). Grok 4.7: Recall 36 % (runs 29 %, 43 %); Precision 64 % (runs 57 %, 71 %). GPT-6.1 Sol · xhigh: Recall 43 % (runs 43 %, 43 %); Precision 83 % (runs 100 %, 67 %). GPT-6 Astra · xhigh: Recall 43 % (runs 43 %, 43 %); Precision 93 % (runs 86 %, 100 %). omelette-reviewer (claude-opus-5-5) · xhigh: Recall 32 % (runs 36 %, 27 %); Precision 75 % (runs 83 %, 67 %).</desc>

<title id="cost-title">Cost: score against time and tokens per call</title>
<desc id="cost-desc">Cost: score against time and tokens per call. 2026-10-21 (3 arms; 15 carried from 2026-10-16) · N = 1–2 runs per arm · runs shown, no intervals. CLI versions: agy 1.4.0, agy 1.4.4, codex 0.162.1, grok 1.0.60. Gemini's token counts exclude thinking tokens: the unit reports input and output only. 1 Gemini 3.8 Flash · Low R: 90 %, 22 s. 1 Gemini 3.8 Flash · Low V: 21 %, 12 s. 2 Gemini 3.8 Flash · Medium R: 90 %, 34 s. 2 Gemini 3.8 Flash · Medium V: 43 %, 497 s. 3 Gemini 3.8 Flash · High R: 85 %, 58 s. 3 Gemini 3.8 Flash · High V: 29 %, 511 s. 4 Gemini 4 Argon · Low R: 80 %, 41 s. 4 Gemini 4 Argon · Low V: 29 %, 58 s. 5 Gemini 4 Argon · Medium R: 90 %, 36 s. 5 Gemini 4 Argon · Medium V: 29 %, 69 s. 6 Gemini 4 Argon · High R: 80 %, 70 s. 6 Gemini 4 Argon · High V: 29 %, 560 s. 7 Grok 4.7 R: 100 %, 31 s. 7 Grok 4.7 V: 36 %, 924 s. 8 GPT-6.1 Sol · xhigh R: 100 %, 30 s. 8 GPT-6.1 Sol · xhigh V: 43 %, 273 s. 9 GPT-6 Astra · xhigh R: 100 %, 29 s. 9 GPT-6 Astra · xhigh V: 43 %, 328 s. 1 Gemini 3.8 Flash · Low R: 90 %, 49.2K. 1 Gemini 3.8 Flash · Low V: 21 %, 9.2K. 2 Gemini 3.8 Flash · Medium R: 90 %, 55.5K. 2 Gemini 3.8 Flash · Medium V: 43 %, 159.4K. 3 Gemini 3.8 Flash · High R: 85 %, 64.9K. 3 Gemini 3.8 Flash · High V: 29 %, 173.8K. 4 Gemini 4 Argon · Low R: 80 %, 17.7K. 4 Gemini 4 Argon · Low V: 29 %, 22.5K. 5 Gemini 4 Argon · Medium R: 90 %, 15.8K. 5 Gemini 4 Argon · Medium V: 29 %, 22.2K. 6 Gemini 4 Argon · High R: 80 %, 23.7K. 6 Gemini 4 Argon · High V: 29 %, 72.6K. 7 Grok 4.7 R: 100 %, 53.1K. 7 Grok 4.7 V: 36 %, 191.7K. 8 GPT-6.1 Sol · xhigh R: 100 %, 136.7K. 8 GPT-6.1 Sol · xhigh V: 43 %, 778.4K. 9 GPT-6 Astra · xhigh R: 100 %, 108.8K. 9 GPT-6 Astra · xhigh V: 43 %, 660.4K.</desc>

<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cost-title cost-desc" viewBox="0 0 760 586" width="760" height="586">
<title id="cost-title">Cost: score against time and tokens per call</title>
<desc id="cost-desc">Cost: score against time and tokens per call. 2026-11-20 (13 arms; 3 carried from 2026-10-16) · N = 2–4 runs per arm. CLI versions: agy 1.5.13, agy 1.5.14, codex 0.162.1, grok 1.0.60, unknown. carried from 2026-10-16, with that round's tasks and CLIs: Grok 4.7, GPT-6.1 Sol · xhigh, GPT-6 Astra · xhigh. V Gemini 4 Hydrogen · High: incomplete, tasks per run 3, 3, 5, 5 of 8, 1 of the suite's tasks never run. V Gemini 4 Neon · High: incomplete, tasks per run 3, 2, 6, 5 of 8, 1 of the suite's tasks never run. V Gemini 4 Neon · XHigh: incomplete, tasks per run 1, 1 of 2, 7 of the suite's tasks never run. Gemini's token counts exclude thinking tokens: the unit reports input and output only. 1 Gemini 4 Hydrogen · High R: 71 %, 148 s. 1 Gemini 4 Hydrogen · High V: 21 %, 167 s. 2 Gemini 4 Neon · Medium R: 67 %, 125 s. 3 Gemini 4 Neon · High R: 67 %, 221 s. 3 Gemini 4 Neon · High V: 36 %, 404 s. 4 Gemini 4 Neon · XHigh V: 43 %, 1038 s. 5 Grok 4.7 V: 36 %, 924 s. 6 GPT-6.1 Sol · xhigh V: 43 %, 273 s. 7 GPT-6 Astra · xhigh V: 43 %, 328 s. 8 omelette-reviewer (claude-opus-5-5) · xhigh V: 32 %, 474 s. 1 Gemini 4 Hydrogen · High R: 71 %, 53.3K. 1 Gemini 4 Hydrogen · High V: 21 %, 64.9K. 2 Gemini 4 Neon · Medium R: 67 %, 34.5K. 3 Gemini 4 Neon · High R: 67 %, 57K. 3 Gemini 4 Neon · High V: 36 %, 79.3K. 4 Gemini 4 Neon · XHigh V: 43 %, 242.8K. 5 Grok 4.7 V: 36 %, 191.7K. 6 GPT-6.1 Sol · xhigh V: 43 %, 778.4K. 7 GPT-6 Astra · xhigh V: 43 %, 660.4K. 8 omelette-reviewer (claude-opus-5-5) · xhigh V: 32 %, 109.9K.</desc>

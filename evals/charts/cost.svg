<text class="t" x="16" y="26" font-size="16" font-weight="600">Cost: score against time and tokens per call</text>
<text class="t2" x="16" y="46" font-size="12">One point per arm and suite: R the share answered correctly, V recall. Numbers name the arms (key below)</text>
<text class="t2" x="16" y="66" font-size="12">2026-10-21 (3 arms; 15 carried from 2026-10-16) · N = 1–2 runs per arm · runs shown, no intervals</text>
<text class="t2" x="16" y="82" font-size="12">CLI versions: agy 1.4.0, agy 1.4.4, codex 0.162.1, grok 1.0.60</text>
<text class="t2" x="16" y="98" font-size="12">Gemini's token counts exclude thinking tokens: the unit reports input and output only.</text>
